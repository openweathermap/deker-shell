                                ###############
                                ### PROJECT ###
                                ###############

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "deker_shell"
dynamic = ["version"]  # version comes from the git tag (uv-dynamic-versioning)
description = "Interactive shell for Deker"
authors = [{ name = "OpenWeather", email = "info@openweathermap.org" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ptpython>=3.0.32,<4",
    "click>=8.5,<9",
]

[project.scripts]
deker = "deker_shell.main:start"

[project.urls]
documentation = "https://docs.deker.io/"
homepage = "https://deker.io/"
repository = "https://github.com/openweathermap/deker-shell"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
metadata = false

[tool.hatch.build.targets.wheel]
packages = ["deker_shell"]

[tool.hatch.build.targets.sdist]
include = ["deker_shell"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"

[tool.uv]
default-groups = ["dev", "docs"]


                                ####################
                                ### DEPENDENCIES ###
                                ####################

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ssort>=0.17.0",
    "pyupgrade>=3.19.0",
    "pydoclint>=0.6.0",
    "mypy>=2.4.0",
    "mypy-extensions>=1.1.0",
    "pre-commit>=4.6.2",
    "bandit>=1.9.4",
    "coverage>=7.16.2",
    "deepdiff>=9.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "pytest-random-order>=1.2.0",
    "pytest-mock>=3.17.0",
    "deker>=1.2.0b1,<2",
    "deker-server-adapters>=1.2.0",
]
docs = [
    "docutils>=0.21.2",
    "m2r2>=2.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "enum_tools>=0.13.0",
    "sphinx_toolbox>=4.3.1",
    "doc8>=2.0.0",
]

                                    #############
                                    ### TOOLS ###
                                    #############

        ##############
        # FORMATTERS #
        ##############

[tool.ruff]  # code formatter and linter
# https://docs.astral.sh/ruff/
target-version = "py310"
line-length = 120
extend-exclude = [
    "examples",
    "tmp",
    "tmp.py",
]

[tool.ruff.format]
# defaults are equal to black: double quotes, 4 spaces, magic trailing comma
docstring-code-format = false

[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#lint_isort
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = -1  # as isort did: 2 lines before a def/class, 1 otherwise
lines-between-types = 1
known-local-folder = ["deker_shell"]
known-third-party = [
    "deker",
    "ptpython",
]
extra-standard-library = ["zoneinfo"]

        ###########
        # LINTERS #
        ###########

[tool.mypy]  # code linter
# https://mypy.readthedocs.io/en/stable/
# https://pypi.org/project/mypy-extensions/
python_version = "3.10"
ignore_missing_imports = true
scripts_are_modules = true
allow_redefinition = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_no_return = false
show_error_context = true
show_column_numbers = true
show_error_codes = true
color_output = false
pretty = true
exclude = [
    '^setup\.py$',
    '^tmp\.py$',
    '^venv/',
    '^.venv/',
    '^test+\.py$',
    '^conftest\.py$',
    '^tmp/',
    '^examples/'
]

[[tool.mypy.overrides]]
module = "tests/*"
disallow_untyped_defs = false

[tool.ruff.lint]  # code linter
# https://docs.astral.sh/ruff/rules/
# E, W   - pycodestyle          (flake8 core)
# F      - pyflakes             (flake8 core)
# C90    - mccabe               (flake8 core)
# B      - flake8-bugbear
# D      - pydocstyle           (flake8-docstrings)
# I      - isort                (isort + flake8-import-order)
# N      - pep8-naming
# PT     - flake8-pytest-style
select = ["E", "W", "F", "C90", "B", "D", "I", "N", "PT"]
ignore = [
    "B9",  # flake8-bugbear "opinionated" rules: opt-in in flake8, were never enabled
    "B012",
    "D100",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D401",
    "D404",
    "N807",
    "N813",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",      # docstrings are not required in tests
    "N802",   # test data factories keep their names
    "N805",
    "PT008",  # existing test structure stays as written: patch(lambda), raises/warns blocks,
    "PT011",  # composite assertions, duplicate parametrize cases
    "PT012",
    "PT014",
    "PT017",
    "PT018",
    "PT031",
    "B018",   # a property access that is expected to raise
]
"__init__.py" = [
    "D104",
    "F401",
    "F403",
    "F405",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.pydoclint]  # docstring vs signature linter (darglint replacement)
# https://jsh9.github.io/pydoclint/
style = "sphinx"
exclude = '\.git|\.venv|venv|\.eggs|tests|docs|examples|tmp|tmp\.py'
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-raises = true
check-class-attributes = false
check-arg-order = false  # darglint did not check the order either
allow-init-docstring = true  # __init__ may keep its own docstring, as it does now

[tool.doc8]  # RST linter
# https://github.com/PyCQA/doc8
max-line-length = 99

[tool.bandit]  # security linter
# https://github.com/PyCQA/bandit
skips = ["B110", "B324"]

        #########
        # TESTS #
        #########

[tool.pytest.ini_options]  # pytest
# https://docs.pytest.org
# https://pypi.org/project/pytest-asyncio/
# https://pytest-cov.readthedocs.io/en/latest/
# https://pypi.org/project/pytest-pythonpath/
# https://pypi.org/project/pytest-sugar/
minversion = 7.0
asyncio_mode = "auto"
addopts = ["--ignore=tmp.py"]
norecursedirs = "data"
testpaths = "./tests"

#log_cli = true
#log_cli_level = "DEBUG"

pythonpath = ["./deker_shell", "./.venv", "./venv"]
filterwarnings = ["ignore::UserWarning", 'ignore::DeprecationWarning', "ignore::ResourceWarning"]

[tool.coverage.run]  # coverage
branch = true
omit = [
    "tests/*",
    "tmp.py",
    "setup.py",
]

[tool.coverage.html]
directory = "tests/code_coverage"

[tool.coverage.report]
fail_under=100
exclude_lines = [
    "no cov",
    "pragma: no cover",
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pass",
    "raise NotImplementedError",
    "except ImportError",
    "except ModuleNotFoundError",
    "except Exception"
]
