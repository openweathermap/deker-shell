name: build

on:
  push:
    tags:
      - 'v[1-9]+.[0-9]+.[0-9]+'

jobs:
  tests:
    uses: openweathermap/deker-actions/.github/workflows/tox.yml@feature/v2.0.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      numpy-floors: '[{"python": "3.10", "numpy": "1.26.4"}, {"python": "3.11", "numpy": "1.26.4"}, {"python": "3.12", "numpy": "1.26.4"}, {"python": "3.13", "numpy": "2.1.0"}, {"python": "3.14", "numpy": "2.3.2"}]'
      siblings: '["deker", "deker-local-adapters", "deker-server-adapters", "deker-tools"]'

  build:
    needs: tests
    name: Build the distributions
    uses: openweathermap/deker-actions/.github/workflows/build.yml@feature/v2.0.0

  upload_pypi:
    name: Publish the distributions
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/${{ vars.PACKAGE_NAME }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          name: artifact
          path: dist

      - name: Publish the distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
